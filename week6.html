<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body  class="min-h-screen bg-gray-50 flex items-center justify-center p-6">

    <div class="max-w-sm w-full mx-auto bg-white rounded-xl shadow-lg p-8">
        <div class="flex items-center justify-between mb-3">
            <h1 class="text-2xl font-bold text-center text-gray-900 mb-6">BMI計算ツール</h1>
        </div>

        <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">身長（cm）</label>
        <input id="height" type="number" placeholder="例：170" class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">体重（kg）</label>
            <input id="weight" type="number" placeholder="例：65" class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <button id="button" class="bg-blue-600 text-white w-full py-2 rounded-lg font-semibold hover:bg-blue-70 hover:bg-blue-500">計算する</button>

        <p id="result" class="mt-6 text-center text-lg font-bold text-gray-800"></p>

    </div>

    <script>
        function calcBMI(height,weight) {const heightM = height/100;
            return weight/(heightM*heightM); }

        function getResult(bmi){
            if(bmi < 18) {return"瘦せ型";}
            else if(bmi<25) {return"普通";}
            else {return"肥満";}
        }

        const button = document.querySelector("#button");
        const result = document.querySelector("#result");

        button.addEventListener("click", () => {
            const height = Number(document.querySelector("#height").value);
            const weight = Number(document.querySelector("#weight").value);

            if (height <= 0 || weight <= 0){
            result.textContent = "身長と体重を入力してください";
            return;
        }

        const bmi = calcBMI(height,weight);
        const judgment = getResult(bmi);

        result.textContent = "BMI: " + bmi.toFixed(1) + "("+ judgment +")"; 
        });

    </script>
    

    
</body>
</html>
