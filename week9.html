<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-xl shadow-md p-8 w-full max-w-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">新規アカウント登録</h1>

    <div id="messageBox" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

    <form id="signupForm" class="space-y-5" novalidate>
        
        <div>
            <label for="userName" class="block text-sm font-semibold text-slate-700 mb-1"> お名前 <span class="text-red-500">*</span>
            </label>
            <input type="text" id="userName" name="userName" required placeholder="山田 太郎"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <div>
            <label for="userEmail" class="block text-sm font-semibold text-slate-700 mb-1">メールアドレス <span class="text-red-500">*</span>
            </label>
            <input type="email" id="userEmail" name="userEmail" required  placeholder="example@email.com"    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <div>
            <label for="userPassword" class="block text-sm font-semibold text-slate-700 mb-1">パスワード（8文字以上） <span class="text-red-500">*</span>
            </label>
            <input type="password" id="userPassword" name="userPassword" required minlength="8" placeholder="••••••••"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <div class="flex items-center gap-3 py-2">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required
            class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
            <label for="agreeTerms" class="text-sm text-slate-600 cursor-pointer select-none">
            <a href="#" class="text-blue-600 underline hover:text-blue-800">利用規約</a>に同意する <span class="text-red-500">*</span>
            </label>
        </div>

        <button type="submit" class="w-full bg-orange-600 text-white font-semibold py-2.5 rounded-lg hover:bg-orange-700 active:bg-orange-800 transition duration-150 shadow">
            登録する
        </button>

    </form>
    </div>

    <script>
        const signupForm = document.getElementById("signupForm");
        const messageBox = document.getElementById("messageBox");

        signupForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const nameValue = document.getElementById("userName").value.trim();
        const emailValue = document.getElementById("userEmail").value.trim();
        const passwordValue = document.getElementById("userPassword").value;
        const isAgreed = document.getElementById("agreeTerms").checked;

        messageBox.className = "hidden mb-6 p-4 rounded-lg text-sm font-medium";
        messageBox.textContent = "";

        if (nameValue === "") {
            showError("お名前を入力してください");
            return;
        }

        if (emailValue === "") {
            showError("メールアドレスを入力してください");
            return;
        }

        if (passwordValue === "") {
            showError("パスワードを入力してください");
            return;
        }

        if (passwordValue.length < 8) {
            showError("パスワードは8文字以上で入力してください");
            return;
        }

        if (!isAgreed) {
          showError("利用規約への同意が必要です");
          return;
        }

        showSuccess(`登録完了！`);
      });

      // エラーメッセージ表示用の共通関数
      function showError(text) {
        messageBox.textContent = text;
        messageBox.className = "mb-6 p-4 rounded-lg text-sm font-medium bg-red-50 text-red-600 border border-red-200";
      }

      // 成功メッセージ表示用の共通関数
      function showSuccess(text) {
        messageBox.textContent = text;
        messageBox.className = "mb-6 p-4 rounded-lg text-sm font-medium bg-green-50 text-green-700 border border-green-200";
      }
    </script>

  </body>
</html>
